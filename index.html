<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chromatic Scale Generator</title>
<link rel="icon" href="icon.ico">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#16232f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chromatic">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>Chromatic Scale Generator</h1>
    <button type="button" id="langBtn" class="ghost" aria-label="Language">EN</button>
  </header>
  <p id="intro" class="intro"></p>

  <section aria-labelledby="samplesTitle">
    <h2 id="samplesTitle"></h2>
    <div id="drop" class="drop" tabindex="0">
      <p id="dropText"></p>
      <div class="row">
        <button type="button" id="pickFiles"></button>
        <button type="button" id="pickFolder" class="ghost"></button>
      </div>
    </div>
    <input type="file" id="filesInput" accept="audio/*,.wav" multiple hidden>
    <input type="file" id="folderInput" webkitdirectory multiple hidden>
    <ol id="sampleList" class="samples"></ol>
  </section>

  <section aria-labelledby="rangeTitle">
    <h2 id="rangeTitle"></h2>
    <div class="kbwrap"><div id="keyboard" class="keyboard" role="img"></div></div>
    <p id="kbCaption" class="caption"></p>

    <div class="grid">
      <label><span id="lblNote"></span>
        <select id="startNote"></select></label>
      <label><span id="lblOct"></span>
        <select id="startOct"><option value="0">2</option><option value="1">3</option><option value="2">4</option></select></label>
      <label><span id="lblRange"></span>
        <input id="range" type="number" min="1" max="60" step="1" value="24"></label>
      <label><span id="lblGap"></span>
        <input id="gap" type="number" min="0" step="0.05" value="0.1"></label>
    </div>
    <label class="check"><input type="checkbox" id="pitched" checked><span id="lblPitched"></span></label>
    <label class="check"><input type="checkbox" id="dump" checked><span id="lblDump"></span></label>
    <label class="check"><input type="checkbox" id="slicex" checked><span id="lblSlicex"></span></label>
  </section>

  <div class="actions">
    <button type="button" id="generate" class="primary"></button>
    <span id="status" role="status" aria-live="polite"></span>
  </div>
  <progress id="bar" max="1" value="0" hidden></progress>

  <section id="result" hidden aria-labelledby="resTitle">
    <h2 id="resTitle"></h2>
    <audio id="player" controls></audio>
    <div class="row">
      <button type="button" id="dlChromatic" class="primary"></button>
      <button type="button" id="dlSamples" class="ghost" hidden></button>
      <button type="button" id="dlFolder" class="ghost" hidden></button>
    </div>
    <ul id="warnings" class="warnings"></ul>
  </section>

  <section id="dwpSection" hidden aria-labelledby="dwpTitle">
    <h2 id="dwpTitle"></h2>
    <p id="dwpIntro" class="caption"></p>
    <div class="grid">
      <label><span id="lblDwpName"></span><input id="dwpName" type="text" maxlength="40" value="Chromatic" autocomplete="off" spellcheck="false"></label>
      <label><span id="lblDwpQ"></span>
        <select id="dwpQuality"><option value="hi"></option><option value="std" selected></option><option value="lo"></option><option value="min"></option></select></label>
    </div>
    <label class="check"><input type="checkbox" id="dwpTrim" checked><span id="lblDwpTrim"></span></label>
    <label class="check"><input type="checkbox" id="dwpLoop" checked><span id="lblDwpLoop"></span></label>
    <div class="actions">
      <button type="button" id="dwpMake" class="primary"></button>
      <button type="button" id="dwpSave" class="ghost" hidden></button>
    </div>
    <progress id="dwpBar" max="1" value="0" hidden></progress>
    <p id="dwpStatus" class="caption" role="status" aria-live="polite"></p>
  </section>

  <footer id="footer"></footer>
</main>
<script type="module" src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
